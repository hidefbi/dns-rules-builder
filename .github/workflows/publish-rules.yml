name: publish-rules

# Weekly scheduled build: Monday 15:00 GMT-4 (19:00 UTC).
# Scheduled and DRY runs build, sign and report only. They never publish, and they
# open a GitHub Issue (scheduled runs) with a comparison against the published version.
# Publishing is a separate manual run: confirm=PUBLISH and source_run=<id of a reviewed build>.
# The publish job re-verifies that reviewed artifact and needs approval of the
# "production" environment before it pushes to hidefbi/rules-old.

on:
  schedule:
    - cron: '0 19 * * 1'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'DRY = build and report only; PUBLISH = publish the reviewed build in source_run'
        required: true
        default: 'DRY'
        type: string
      source_run:
        description: 'Run id of a reviewed build (required for PUBLISH)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: publish-rules
  cancel-in-progress: false

env:
  BLCONFIG: config.json
  CODEC: b8
  INDIR: files
  OUTDIR: out
  EXPECTED_LISTS: '145'
  RULES_RAW: https://raw.githubusercontent.com/hidefbi/rules-old/main

jobs:
  build:
    if: github.event.inputs.confirm != 'PUBLISH'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -q aiohttp
          npm ci --ignore-scripts

      - name: Check config
        run: |
          python3 - <<'PY'
          import json
          conf = json.load(open('config.json'))['conf']
          n = int('${{ env.EXPECTED_LISTS }}')
          assert len(conf) == n, f'list count {len(conf)} != {n}'
          assert not any('id' in e for e in conf), 'config must not contain "id"; ids are positional'
          assert not any({'dead', 'ignore'} & set(e['pack']) for e in conf), 'dead/ignore list found'
          print('config ok:', len(conf), 'lists')
          PY

      - name: Download lists
        run: |
          rm -rf "$INDIR" "$OUTDIR"
          UNIX_EPOCH_SEC=$(date +%s) python3 download.py > download.log 2>&1
          COUNT=$(find "$INDIR" -name '*.txt' | wc -l)
          echo "downloaded files: $COUNT / expected: $EXPECTED_LISTS"
          test "$COUNT" -eq "$EXPECTED_LISTS" || { tail -50 download.log; exit 1; }

      - name: Build trie
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          UNIX_EPOCH_SEC=$(date +%s) node --expose-gc src/build.js > build.log 2>&1
          test -s "$OUTDIR/td.txt" && test -s "$OUTDIR/rd.txt"

      - name: Verify build
        run: |
          python3 - <<'PY'
          import json, urllib.request
          out = 'out'
          bc = json.load(open(f'{out}/basicconfig.json'))
          ft = json.load(open(f'{out}/filetag.json'))
          n = int('${{ env.EXPECTED_LISTS }}')
          vals = sorted(v['value'] for v in ft.values())
          assert bc['useCodec6'] is False, 'codec must be b8 (useCodec6 false)'
          assert vals == list(range(n)), 'list ids must be contiguous 0..N-1 with no gaps'
          zero = [v['vname'] for v in ft.values() if v['entries'] == 0]
          assert not zero, f'lists with zero entries: {zero}'
          ts = int(bc['timestamp'].split('/')[1])
          try:
              last = json.load(urllib.request.urlopen('${{ env.RULES_RAW }}/update/blocklists'))['latest']
          except Exception as e:
              raise SystemExit(f'could not read the online version; stopping: {e}')
          assert ts > last, f'new timestamp {ts} must be greater than online {last} (anti-rollback)'
          print('verify ok: timestamp', ts, 'lists', n, 'online', last)
          PY

      - name: Sign
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          umask 077
          KEYFILE="$RUNNER_TEMP/private.pem"
          printf '%s\n' "$PRIVATE_KEY" > "$KEYFILE"
          SRC="$OUTDIR" CFG=config.json KEY="$KEYFILE" PUB=public.pem OUT=rules-publish python3 ci_sign.py
          rm -f "$KEYFILE"
          ls -l rules-publish

      - name: Build change report
        run: python3 diff_report.py "$OUTDIR" "${RULES_RAW}/blocklists" > report.md && cat report.md

      - name: Open issue with the report (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Weekly rules build ${{ github.run_id }}: review before publishing" \
            --body-file report.md

      - uses: actions/upload-artifact@v4
        with:
          name: rules-publish
          path: rules-publish
          retention-days: 30

  publish:
    if: github.event.inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a reviewed build
        env:
          SOURCE_RUN: ${{ github.event.inputs.source_run }}
        run: |
          test -n "$SOURCE_RUN" || { echo "source_run is required to publish"; exit 1; }
          echo "publishing the reviewed build from run $SOURCE_RUN"

      - uses: actions/checkout@v4

      - name: Download the reviewed artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ github.event.inputs.source_run }}
        run: |
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n rules-publish -D rules-publish

      - name: Verify signature and file hashes
        run: |
          base64 -d rules-publish/index.json.sig > sig.der
          openssl dgst -sha256 -verify public.pem -signature sig.der rules-publish/index.json
          python3 - <<'PY'
          import hashlib, json
          idx = json.load(open('rules-publish/index.json'))
          for name, meta in idx['files'].items():
              data = open('rules-publish/' + name, 'rb').read()
              assert hashlib.sha256(data).hexdigest() == meta['sha256'], name
              assert len(data) == meta['size'], name
          print('hashes ok:', sorted(idx['files']))
          PY

      - name: Publish to rules-old (single squashed commit)
        env:
          RULES_TOKEN: ${{ secrets.RULES_TOKEN }}
        run: |
          set -euo pipefail
          NEW=$(python3 -c "import json;print(json.load(open('rules-publish/update/blocklists'))['latest'])")
          LAST=$(curl -fsSL "${RULES_RAW}/update/blocklists" | python3 -c "import sys,json;print(json.load(sys.stdin)['latest'])")
          test "$NEW" -gt "$LAST" || { echo "timestamp did not increase; stopping"; exit 1; }
          rm -rf site && mkdir site && cp -R rules-publish/. site/
          cd site
          git init -q -b main
          git config user.name "hidefbi"
          git config user.email "325145828+hidefbi@users.noreply.github.com"
          git add -A
          git commit -q -m "Rules set $NEW"
          git remote add origin "https://x-access-token:${RULES_TOKEN}@github.com/hidefbi/rules-old.git"
          git push -q -f origin main
          echo "published $NEW"
